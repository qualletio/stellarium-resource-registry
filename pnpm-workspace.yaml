packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  sharp: true
  sqlite3: true
  unrs-resolver: false

minimumReleaseAgeExclude:
  - stellarium-ts@0.14.0 || 0.15.0 || 0.16.0 || 0.17.0 || 0.20.0 || 0.21.0 || 0.22.0
  - requestscript@1.5.0 || 1.6.0 || 1.7.0

onlyBuiltDependencies:
  - esbuild
  - sharp
  - sqlite3
